let activeLabel = null;
const AVATAR_COLORS = ['#6c8ef5','#e06c75','#56b6c2','#e5c07b','#98c379','#c678dd','#61afef','#d19a66'];

function labelColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function linkify(text) {
  const escaped = escHtml(text);
  const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return escaped.replace(urlPattern, '<a href="$1" target="_blank" class="email-link">$1</a>');
}

function renderLabelList(items) {
  const list = document.getElementById('label-list');
  list.innerHTML = items.map(l => `
    <div class="label-item${l.id === activeLabel ? ' active' : ''}" data-id="${escHtml(l.id)}" onclick="selectLabel(this.dataset.id)">
      <div class="label-icon" style="background:${labelColor(l.id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
      <div class="label-name">${escHtml(l.name)}</div>
      <div class="badge-container">
        ${l.unread_count > 0 ? `<span class="badge badge-new">${l.unread_count}</span>` : ''}
        <span class="badge badge-total">${l.emails.length}</span>
      </div>
    </div>
  `).join('');
}

function selectLabel(id) {
  activeLabel = id;
  const label = DATA.find(l => l.id === id);
  if (!label) return;
  document.querySelectorAll('.label-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  document.getElementById('header-name').textContent = label.name;
  document.getElementById('header-sub').innerHTML = `<span class="${label.unread_count > 0 ? 'text-new' : 'text-success'}">${label.unread_count} unread</span> · ${label.emails.length} total`;
  
  const emailList = document.getElementById('email-list');
  emailList.innerHTML = label.emails.map(e => `
    <div class="email-card ${e.isUnread ? 'unread-card' : ''}">
      <div class="email-meta">
        <div class="email-subject">${e.isUnread ? '<span class="unread-dot"></span>' : ''}${linkify(e.subject)}</div>
        <div class="email-date">${escHtml(e.date)}</div>
      </div>
      <div class="email-sender">${escHtml(e.sender)}</div>
      <div class="email-summary-box"><strong>TL;DR:</strong> ${escHtml(e.summary)}</div>
      <div class="email-preview">${linkify(e.preview)}</div>
    </div>
  `).join('');
}

const totalEmails = DATA.reduce((n, l) => n + l.emails.length, 0);
const totalUnread = DATA.reduce((n, l) => n + l.unread_count, 0);
document.getElementById('total-count').innerHTML = `${DATA.length} labels · ${totalUnread > 0 ? `<span class="text-new">${totalUnread} new</span>` : '<span class="text-success">Caught up!</span>'} · ${totalEmails} total`;

renderLabelList(DATA);
document.getElementById('search-box').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  renderLabelList(q ? DATA.filter(l => l.name.toLowerCase().includes(q)) : DATA);
});
</script>
