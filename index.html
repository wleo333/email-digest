<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail Inbox — by Label</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --sidebar-bg: #1e2130;
      --sidebar-hover: #2a2f47;
      --sidebar-active: #3b4266;
      --sidebar-text: #c8cde8;
      --sidebar-sub: #7780a8;
      --accent: #6c8ef5;
      --card-bg: #ffffff;
      --card-border: #e4e7ef;
      --card-hover: #f5f7ff;
      --text-primary: #1a1d2e;
      --text-secondary: #5a6080;
      --text-preview: #8890b0;
      --badge-bg: #6c8ef5;
      --badge-text: #fff;
      --header-bg: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    #sidebar {
      width: 300px;
      min-width: 220px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 22px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    #sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.3px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--sidebar-sub);
      margin-top: 3px;
    }

    #search-box {
      margin: 12px 14px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.07);
      color: var(--sidebar-text);
      font-size: 13px;
      outline: none;
      width: calc(100% - 28px);
    }
    #search-box::placeholder { color: var(--sidebar-sub); }
    #search-box:focus { border-color: var(--accent); background: rgba(255,255,255,.10); }

    #label-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
    }
    #label-list::-webkit-scrollbar { width: 4px; }
    #label-list::-webkit-scrollbar-track { background: transparent; }
    #label-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

    .label-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background .15s;
      border-left: 3px solid transparent;
    }
    .label-item:hover { background: var(--sidebar-hover); }
    .label-item.active {
      background: var(--sidebar-active);
      border-left-color: var(--accent);
    }

    .label-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .label-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--sidebar-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px;
      font-weight: 700;
      min-width: 22px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #main-header {
      background: var(--header-bg);
      padding: 18px 28px;
      border-bottom: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    #main-header h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.4px;
    }
    #main-header p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    #email-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    #email-list::-webkit-scrollbar { width: 6px; }
    #email-list::-webkit-scrollbar-track { background: transparent; }
    #email-list::-webkit-scrollbar-thumb { background: #cdd0e0; border-radius: 4px; }

    .email-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 8px;
      transition: box-shadow .15s, background .15s;
    }
    .email-card:hover {
      box-shadow: var(--shadow-md);
      background: var(--card-hover);
    }

    .email-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 3px;
    }

    .email-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }
    .email-date {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .email-sender {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .email-preview {
      font-size: 13px;
      color: var(--text-preview);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-secondary);
    }
    .placeholder svg { opacity: .3; }
    .placeholder p { font-size: 15px; }

    #no-results {
      padding: 40px 20px;
      text-align: center;
      color: var(--sidebar-sub);
      font-size: 13px;
    }
  </style>
</head>

"NIST Tech Beat"}]}];

let activeLabel = null;

const AVATAR_COLORS = ['#6c8ef5','#e06c75','#56b6c2','#e5c07b','#98c379','#c678dd','#61afef','#d19a66'];

function labelColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLabelList(items) {
  const list = document.getElementById('label-list');
  if (!items.length) {
    list.innerHTML = '<div id="no-results">No labels found.</div>';
    return;
  }
  list.innerHTML = items.map(l => `
    <div class="label-item${l.id === activeLabel ? ' active' : ''}"
         data-id="${escHtml(l.id)}"
         onclick="selectLabel(this.dataset.id)">
      <div class="label-icon" style="background:${labelColor(l.id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
      <div class="label-name" title="${escHtml(l.name)}">${escHtml(l.name)}</div>
      <div class="label-badge">${l.emails.length}</div>
    </div>
  `).join('');
}

function selectLabel(id) {
  activeLabel = id;
  const label = DATA.find(l => l.id === id);
  if (!label) return;

  document.querySelectorAll('.label-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  document.getElementById('header-name').textContent = label.name;
  document.getElementById('header-sub').textContent =
    label.emails.length + ' email' + (label.emails.length !== 1 ? 's' : '');

  const emailList = document.getElementById('email-list');
  if (!label.emails.length) {
    emailList.innerHTML = '<div class="placeholder"><p>No emails found.</p></div>';
    return;
  }
  emailList.innerHTML = label.emails.map(e => `
    <div class="email-card">
      <div class="email-meta">
        <div class="email-subject">${escHtml(e.subject)}</div>
        <div class="email-date">${escHtml(e.date)}</div>
      </div>
      <div class="email-sender">${escHtml(e.sender)}</div>
      <div class="email-preview">${escHtml(e.preview)}</div>
    </div>
  `).join('');
}

const totalEmails = DATA.reduce((n, l) => n + l.emails.length, 0);
document.getElementById('total-count').textContent =
  DATA.length + ' labels · ' + totalEmails + ' emails';

renderLabelList(DATA);

document.getElementById('search-box').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const filtered = q ? DATA.filter(l => l.name.toLowerCase().includes(q)) : DATA;
  renderLabelList(filtered);
});

</script>
